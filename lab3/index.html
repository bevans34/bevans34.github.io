<!DOCTYPE html>
<html>
<head>
<title> Signup Page </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"> <!-- Import bootstrap -->
</head>

<body>
        <h1 class="p-4 bg-info text-center"> Signup Page </h1>
        <form action="welcome.html" id="signupForm">
                First Name:<input type="text" name="fName"><br>
                Last Name:<input type="text" name="lName"><br>
                Gender:    
                <input type="radio" name="gender" value="m">Male
                <input type="radio" name="gender" value="f">Female<br>	
                Zip Code:  <input type="text" id="zip" name="zip">
                <span id="zipError"></span><br>
                City:   <span id="city"></span> <br>
                Latitude:  <span id="latitude"></span><br>
                Longitude: <span id="longitude"></span><br><br>

                State: 
                <select id="state" name="state">
                <option>Loading...</option>
                </select> <br>

                County:
                <select id="county">
                <option>Select a State first!</option>
                </select><br>

                Desired Username: 
                <input type="text" id="username">
                <span id="usernameError"></span><br>

                Password: <input type="password" id="pass">
                <span id="suggestedPwd"></span><br>
                Type Password Again: <input type="password" id="rePass">
                <span id="passwordError"></span><br>

                <input class="btn btn-outline-primary" type="submit" value="Sign up!">
        </form>
        <script src="js/script.js"></script>
</body>

</html>
